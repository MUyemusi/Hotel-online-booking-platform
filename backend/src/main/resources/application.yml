spring:
  application:
    name: zhisu-hotel
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

auth:
  jwt-secret: ${JWT_SECRET:zhisu-hotel-development-jwt-secret-key-2026}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
